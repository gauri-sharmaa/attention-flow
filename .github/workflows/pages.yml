# Builds the static dashboard from a simulated run and publishes it to GitHub
# Pages. Manual only: enable Pages (Settings → Pages → GitHub Actions) first.
name: demo
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go run ./cmd/attnflow sim -out data/sim
      - run: go run ./cmd/attnflow export -events data/sim/events.csv -out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
